html{scroll-behavior:smooth}

.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}

.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;outline:none;min-width:0}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:700 13px Nunito,sans-serif;cursor:pointer}
.tbtn.on{background:var(--ink);color:var(--paper)}
.play{background:var(--acc);color:#fff8ec;border-color:transparent;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px;display:grid;grid-template-columns:220px 1fr;gap:28px}
nav.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
nav.side a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:700;font-size:14.5px}

nav.side a.on{background:var(--card);color:var(--ink);box-shadow:inset 3px 0 0 var(--acc)}
nav.side a i{font-style:normal;width:20px;text-align:center}
main{min-width:0}
main section{scroll-margin-top:84px;margin:0 0 48px}
.lead{color:var(--ink2);max-width:70ch;margin:0 0 16px}
.hero{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:20px}
.hero .txt{padding:22px 22px 18px}
.hero h1{font-size:clamp(36px,6vw,62px);line-height:1}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

.lv{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:800;font-size:12.5px;white-space:nowrap}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:14.5px}

.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;border-radius:14px}
.mats{display:flex;flex-wrap:wrap;gap:4px}
.mat{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 7px 1px 3px;font-size:13px;font-weight:700;white-space:nowrap}
.mat svg{width:18px;height:18px}

details.spoil summary::before{content:'✦ '}
.note{border-left:4px solid var(--gold);background:var(--card);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0;box-shadow:var(--shadow)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 54px;position:relative;box-shadow:var(--shadow)}
.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:800 14px Nunito}
.map{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:#e9d6a8}
.map img{display:block;width:100%;height:auto}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;border:1px solid rgba(0,0,0,.25)}
.kbd{display:inline-block;min-width:22px;text-align:center;padding:0 6px;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;background:var(--card);font:800 12.5px Nunito}
.hide{display:none!important}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mob{display:flex;gap:10px;align-items:flex-start}
.mob .sw{width:38px;height:38px;border-radius:12px;flex:none;border:2px solid rgba(0,0,0,.18)}
.stat{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.stat span{font-size:12.5px;font-weight:800;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:1px 7px}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:30px}
#none{display:none;padding:30px;text-align:center;color:var(--muted)}
.mnav{display:none}

  .cols2{grid-template-columns:1fr}.brand small{display:none}.search{order:5;flex-basis:100%}}

  h+=sec('fazenda',T[L].nav[11][2],S('Compre sementes com o Tio Ão no sítio dos girassóis, are a terra, plante e regue. O tempo de crescer é em minutos de jogo.','Buy seeds from Uncle Ão at the sunflower farm, till the soil, plant and water. Growth time is in game minutes.'),
   '<div class="cols2"><div class="tw"><table class="tbl"><thead><tr><th>'+S('Planta','Crop')+'</th><th>'+S('Cresce','Grows')+'</th><th>'+S('Colhe','Yield')+'</th><th>'+S('Semente','Seed')+'</th></tr></thead><tbody>'+d.crops.map(c=>'<tr data-s><td><span class="dot" style="background:'+c.c+'"></span><b>'+esc(c.n)+'</b></td><td class="n">'+c.G+' min</td><td class="n">'+c.y[0]+'–'+c.y[1]+'</td><td class="n">'+c.sd+'</td></tr>').join('')+'</tbody></table></div>'+
   '<div class="tw"><table class="tbl"><thead><tr><th>'+S('Peixe','Fish')+'</th><th>'+S('Raridade','Rarity')+'</th><th>'+S('Onde','Where')+'</th><th>kg</th></tr></thead><tbody>'+d.fish.map(f=>'<tr data-s><td><b>'+esc(f.n)+'</b></td><td><b class="r'+f.r+'">'+esc(d.rar[f.r].n)+'</b></td><td>'+f.where.map(w=>({fresh:S('Rios e lagos','Rivers and lakes'),sea:S('Mar','Sea'),isl:S('Perto da Ilha do Meio','Near Middle Island')})[w]).join(', ')+'</td><td class="n">'+f.kg[0]+'–'+f.kg[1]+'</td></tr>').join('')+'</tbody></table></div></div>');
  /* transporte */
  h+=sec('transporte',T[L].nav[12][2],'',
   '<div class="grid"><div class="card" data-s><h3>🐎 '+S('Cavalo','Horse')+'</h3><p>'+S('O Vovô Raimundo cria cavalos na vila. Montado você anda bem mais rápido pela estrada.','Grandpa Raimundo raises horses in the village. Riding is much faster on the road.')+'</p><p>'+d.horses.map(x=>'<span class="dot" style="background:'+x.c+'"></span>'+esc(x.n)+' <b>'+x.price+'</b>').join(' · ')+'</p></div>'+
   '<div class="card" data-s><h3>🛒 '+S('Carrinho de carga','Cargo cart')+'</h3><p>'+S('Roda a combustível (galão), leva 2 packs além do que vai nas costas e aparece no mapa. Quebra se apanhar muito, mas dá pra consertar. Se ficar 10 minutos sem dirigir, volta pra mochila e os packs ficam no chão.','Runs on fuel cans, carries 2 packs on top of the one on your back and shows on the map. It breaks if hit too much, but can be repaired. Left 10 minutes without driving, it returns to your bag and the packs stay on the ground.')+'</p></div>'+
   '<div class="card" data-s><h3>⛵ '+S('Barquinho','Little boat')+'</h3><p>'+S('Feito na bancada. Leva você pelo mar até as ilhas e dá pra pescar de dentro dele. Um amigo pode ir junto no seu barco.','Crafted at the workbench. Takes you across the sea to the islands, and you can fish from it. A friend can ride along.')+'</p></div></div>');
  /* missões */
  h+=sec('missoes',T[L].nav[13][2],S('A história principal segue a lenda da Quimera. Os pedidos da família dão XP e recompensas.','The main story follows the legend of the Chimera. Family requests give XP and rewards.'),
   sp('<ol class="steps">'+d.mq.map(q=>'<li data-s><b>'+esc(q.n)+'</b> <small style="color:var(--muted)">· '+esc(q.npc)+'</small>'+(q.act?'<br><span style="font-size:14px;color:var(--ink2)">'+esc(q.act)+'</span>':'')+'</li>').join('')+'</ol>')+
   '<h3 style="margin:18px 0 8px">'+S('Pedidos da família','Family requests')+'</h3><div class="grid">'+d.sideq.map(g=>'<div class="card" data-s><h3>'+esc(g.npc)+'</h3><p style="font-size:14px">'+g.qs.map(q=>'<b>'+esc(q.n)+'</b>'+(q.gt?' — '+esc(q.gt):'')+(q.xp?' · '+q.xp+' XP':'')).join('<br>')+'</p></div>').join('')+'</div>');
  /* níveis */
  h+=sec('niveis',T[L].nav[14][2],S('XP pra passar de cada nível. Coletar, pescar, entregar packs e vencer monstros dá XP. Monstros muito abaixo do seu nível dão menos.','XP needed to pass each level. Gathering, fishing, delivering packs and defeating monsters give XP. Monsters far below your level give less.'),
   '<div class="tw"><table class="tbl"><tbody>'+Array.from({length:12},(_,r)=>'<tr>'+Array.from({length:5},(_,c)=>{ const l=r*5+c+1; return '<td class="n"><b>'+l+'</b> → '+d.xp[l-1].toLocaleString(L==='pt'?'pt-BR':'en')+'</td>'; }).join('')+'</tr>').join('')+'</tbody></table></div>');
  h+='<div id="none">'+t.none+'</div><p class="foot">Bosque Perdido · '+d.ver+' · '+S('Wiki gerada direto do jogo, atualizada a cada versão.','Wiki generated from the game itself, updated every version.')+'</p>';
  document.getElementById('main').innerHTML=h;
  const nv=t.nav.map(n=>'<a href="#'+n[0]+'" data-n="'+n[0]+'"><i>'+n[1]+'</i>'+n[2]+'</a>').join('');
  document.getElementById('side').innerHTML=nv; document.getElementById('mnav').innerHTML=t.nav.map(n=>'<a href="#'+n[0]+'" data-n="'+n[0]+'">'+n[1]+' '+n[2]+'</a>').join('');
  doSearch(); spy();
}
function doSearch(){ const q=(document.getElementById('q').value||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); let any=false;
  document.querySelectorAll('[data-sec]').forEach(sec=>{ let vis=0; const items=sec.querySelectorAll('[data-s]');
    items.forEach(e=>{ const ok=!q||e.textContent.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q); e.classList.toggle('hide',!ok); if(ok) vis++; });
    if(q&&!vis&&!((sec.querySelector('h2,h1')||{}).textContent||'').toLowerCase().includes(q)) sec.classList.add('hide'); else { sec.classList.remove('hide'); if(!q||vis) any=true; } });
  document.getElementById('none').style.display=q&&!any?'block':'none'; }
function spy(){ const secs=[...document.querySelectorAll('[data-sec]')]; let cur=secs[0]&&secs[0].id; for(const s of secs){ if(s.getBoundingClientRect().top<120) cur=s.id; }
  document.querySelectorAll('[data-n]').forEach(a=>a.classList.toggle('on',a.dataset.n===cur)); const m=document.querySelector('#mnav a.on'); if(m&&m.scrollIntoView&&spy.last!==cur){ spy.last=cur; m.scrollIntoView({block:'nearest',inline:'center'}); } }
addEventListener('scroll',()=>requestAnimationFrame(spy),{passive:true});
document.getElementById('q').addEventListener('input',doSearch);
for(const [id,l] of [['lpt','pt'],['len','en']]) document.getElementById(id).onclick=()=>{ L=l; try{ localStorage.setItem('bpw-lang',l); }catch(e){} render(); };
render();
</script>
